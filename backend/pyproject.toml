[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ele-agent-backend"
version = "1.0.0"
description = "ELE Agent Backend - Unified AI Desktop Assistant API"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ELE Agent Team"}]
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.10.0",
    "pydantic-settings==2.6.0",
    "python-multipart==0.0.20",
    "python-jose[cryptography]==3.5.0",
    "passlib[bcrypt]==1.7.4",
    "sqlalchemy==2.0.36",
    "aiosqlite==0.22.0",
    "alembic==1.15.0",
    "httpx==0.28.1",
    "aiofiles==24.1.0",
    "structlog==25.1.0",
    "python-dotenv==1.0.1",
    "tomli==2.2.0",
    "tomli-w==1.1.0",
    "watchfiles==1.2.0",
    "openai==1.65.0",
    "google-generativeai==0.8.6",
    "groq==0.16.0",
    "anthropic==0.49.0",
    "edge-tts==7.2.0",
    "vosk==0.3.45",
    "pyttsx3==2.99",
    "pvporcupine==4.0.3",
    "sounddevice==0.5.5",
    "onnxruntime==1.28.0",
    "faiss-cpu==1.15.0",
    "sentence-transformers==5.7.0",
    "rank-bm25==0.2.2",
    "playwright==1.62.0",
    "playwright-stealth==2.0.3",
    "wasmtime==47.0.1",
    "python-dateutil==2.9.0",
    "pyyaml==6.0.3",
    "rich==15.0.0",
    "langgraph==1.2.11",
    "langgraph-checkpoint==4.2.0",
    "langgraph-checkpoint-sqlite==3.1.1",
    "pyjwt==2.10.0",
    "email-validator==2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.0",
    "pytest-cov==5.0.0",
    "ruff==0.4.0",
    "mypy==1.10.0",
    "black==24.4.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "W", "UP", "B", "C4", "PT"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]