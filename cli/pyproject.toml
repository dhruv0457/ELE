[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ele-agent-cli"
version = "1.0.0"
description = "ELE Agent CLI - Unified AI Desktop Assistant TUI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ELE Agent Team"}]
dependencies = [
    "textual==0.84.0",
    "pydantic==2.10.0",
    "pydantic-settings==2.6.0",
    "tomli==2.2.0",
    "tomli-w==1.1.0",
    "watchfiles==1.2.0",
    "rich==15.0.0",
    "pyyaml==6.0.3",
    "python-dateutil==2.9.0",
    "sounddevice==0.5.5",
    "pvporcupine==4.0.3",
    "vosk==0.3.45",
    "pyttsx3==2.99",
    "edge-tts==7.2.0",
    "onnxruntime==1.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.0",
    "pytest-cov==5.0.0",
    "ruff==0.4.0",
    "mypy==1.10.0",
    "black==24.4.0",
]

[project.scripts]
ele = "cli.src.app:main"

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "W", "UP", "B", "C4", "PT"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]